name: Auto-merge Dependabot PRs

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]

permissions:
  pull-requests: write
  contents: read
  checks: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: "github.event.pull_request.user.login == 'dependabot[bot]' || contains(join(' ', github.event.pull_request.labels.*.name), 'dependencies')"
    steps:
      - name: Attempt auto-merge when checks pass
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            const author = pr.user && pr.user.login;
            const labels = pr.labels ? pr.labels.map(l => l.name) : [];
            if (author !== 'dependabot[bot]' && !labels.includes('dependencies')) {
              core.info('Not a Dependabot PR, skipping.');
              return;
            }
            const { owner, repo } = context.repo;
            const head = pr.head.sha;
            const { data: combined } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: head });
            core.info(`Combined status for ${head}: ${combined.state}`);
            if (combined.state !== 'success') {
              core.info('Status not success yet; skipping merge.');
              return;
            }
            await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'squash' });
            core.info(`Merged PR #${pr.number}`);
